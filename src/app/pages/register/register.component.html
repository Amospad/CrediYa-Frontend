<div class="register-container">
  <div class="register-box">
    <h2>CrediYa - Registro</h2>
    <p>Crea tu cuenta</p>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombres</label>
        <input type="text" [(ngModel)]="nombres" name="nombres" required>
      </div>
      <div class="form-group">
        <label>Apellidos</label>
        <input type="text" [(ngModel)]="apellidos" name="apellidos" required>
      </div>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="correoElectronico" name="correo" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Salario Base</label>
        <input type="number" [(ngModel)]="salarioBase" name="salarioBase" required>
      </div>

      <div *ngIf="error" class="error-msg">{{ error }}</div>
      <div *ngIf="success" class="success-msg">{{ success }}</div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
      <p class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/pages/login">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
